[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grantcap"
version = "0.1.0"
description = "Nonprofit position budget in live-formula Excel that charges salaries to restricted grants only within each award's period and balance."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "grantcap contributors" }]
dependencies = [
    "openpyxl>=3.1",
    "formulas>=1.2",
    "pandas>=2.1",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
grantcap = "grantcap.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/grantcap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
